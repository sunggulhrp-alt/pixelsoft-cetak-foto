name: Build PixelSoft Cetak Foto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download project ZIP
        run: |
          unzip -q pixelsoft-cetak-foto-v1.10.0.zip -d pixelsoft-project

      - name: Fix Java string literals
        working-directory: pixelsoft-project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/pixelsoft/cetakfoto/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          replacements = [
              (
                  'Button jual = button("📄  Surat Jual Beli\nIsi data → Buat surat Word", true);',
                  'Button jual = button("📄  Surat Jual Beli\\nIsi data → Buat surat Word", true);'
              ),
              (
                  'Button soon = button("📋  Surat Pernyataan\nSegera hadir", false);',
                  'Button soon = button("📋  Surat Pernyataan\\nSegera hadir", false);'
              ),
              (
                  'Button soon2 = button("📋  Surat Kuasa\nSegera hadir", false);',
                  'Button soon2 = button("📋  Surat Kuasa\\nSegera hadir", false);'
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(
                      "Expected broken Java string not found: "
                      + old.splitlines()[0]
                  )
              s = s.replace(old, new)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: pixelsoft-project
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp pixelsoft-project/app/build/outputs/apk/debug/app-debug.apk \
             pixelsoft-cetak-foto-v1.10.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelSoft-Cetak-Foto-v1.10.1
          path: pixelsoft-cetak-foto-v1.10.1.apk
